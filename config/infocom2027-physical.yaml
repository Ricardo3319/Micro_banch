  combined_queues: 8
  irqbalance: "stopped"
  rps: "off"
  xps: response_sender_or_control_cpus_only
  offloads:
    gro: "off"
    gso: "off"
    tso: "off"
    lro: "off"
    rx_checksum: "on"
    tx_checksum: "on"
  ring_entries_default: 1024
  ring_entries_conditional: 4096
  socket_buffer_request_bytes: 8388608
  sysctl:
    net.core.rmem_max: 16777216
    net.core.wmem_max: 16777216
    net.core.netdev_max_backlog: 250000
  open_file_limit: 65536
  host_profile_sha256: null

runtime:
